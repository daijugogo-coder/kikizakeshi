steps:
  # コンテナのビルド
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/kikizakeshi', '.']

  # Cloud Run にデプロイ
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'kikizakeshi',
      '--image', 'gcr.io/$PROJECT_ID/kikizakeshi',
      '--platform', 'managed',
      '--region', 'us-central1',  # リージョンを指定
      '--allow-unauthenticated'
    ]

images:
  - 'gcr.io/$PROJECT_ID/kikizakeshi'
